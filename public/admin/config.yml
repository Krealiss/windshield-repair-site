# Sveltia CMS — конфігурація
# Сайт: ремонт сколів і тріщин лобового скла
# Розміщення: /public/admin/config.yml

backend:
  name: github
  repo: OWNER/REPO          # ← замінити
  branch: main
  # Cloudflare Worker для OAuth (sveltia-cms-auth)
  base_url: https://auth.example.workers.dev

# Прев'ю-збірка з окремої гілки, щоб чернетки не потрапляли в продакшн
publish_mode: editorial_workflow

media_folder: src/assets/gallery
public_folder: /assets/gallery

# Автоматичний ресайз і WebP на клієнті — власник не зіпсує швидкість
media_libraries:
  default:
    config:
      max_file_size: 10485760
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600

i18n:
  structure: single_file
  locales: [uk]
  # Англійська готова до вмикання: додати en у locales вище
  # locales: [uk, en]
  default_locale: uk

collections:
  # ─────────────────────────────────────────────
  # 1. КОНТАКТИ — критичний рівень
  # ─────────────────────────────────────────────
  - name: settings
    label: Налаштування
    files:
      - name: contacts
        label: Контакти
        file: src/content/contacts.yml
        i18n: true
        fields:
          - name: phone_main
            label: Основний телефон
            widget: string
            required: true
            i18n: duplicate
            pattern:
              - '^\+380\d{9}$'
              - 'Формат: +380XXXXXXXXX, без пробілів і дужок'
            hint: Цей номер підставляється в усі кнопки дзвінка на сайті

          - name: phone_tracking
            label: Номер для колтрекінгу
            widget: string
            required: false
            i18n: duplicate
            pattern: ['^\+380\d{9}$|^$', 'Формат: +380XXXXXXXXX']
            hint: Якщо заповнено — показується замість основного

          - name: viber
            label: Viber
            widget: string
            required: false
            i18n: duplicate

          - name: telegram
            label: Telegram (нік без @)
            widget: string
            required: false
            i18n: duplicate

          - name: address
            label: Адреса
            widget: string
            required: true

          - name: lat
            label: Широта
            widget: number
            required: true
            value_type: float
            i18n: duplicate

          - name: lng
            label: Довгота
            widget: number
            required: true
            value_type: float
            i18n: duplicate

          - name: hours
            label: Графік роботи
            widget: list
            i18n: true
            fields:
              - { name: day, label: День, widget: string }
              - { name: from, label: З, widget: string, required: false }
              - { name: to, label: До, widget: string, required: false }
              - { name: closed, label: Вихідний, widget: boolean, default: false }

      # ─────────────────────────────────────────────
      # 2. ЗОНА ВИЇЗДУ
      # ─────────────────────────────────────────────
      - name: coverage
        label: Виїзний ремонт
        file: src/content/coverage.yml
        i18n: true
        fields:
          - name: areas
            label: Райони і населені пункти
            widget: list
            field: { name: area, label: Назва, widget: string }

          - name: travel_fee
            label: Вартість виїзду, грн
            widget: number
            required: true
            value_type: int
            min: 0
            i18n: duplicate
            hint: 0 = виїзд безкоштовний

          - name: free_from
            label: Безкоштовно від суми, грн
            widget: number
            required: false
            value_type: int
            i18n: duplicate

          - name: radius_km
            label: Радіус виїзду, км
            widget: number
            required: false
            value_type: int
            i18n: duplicate

          - name: conditions
            label: Умови виїзного ремонту
            widget: text
            required: false
            hint: Температура, погода, потреба в накритому паркінгу

  # ─────────────────────────────────────────────
  # 3. ПОСЛУГИ ТА ЦІНИ — важливий рівень
  # ─────────────────────────────────────────────
  - name: services
    label: Послуги та ціни
    folder: src/content/services
    create: true
    delete: true
    i18n: true
    sortable_fields: [order]
    summary: '{{title}} — від {{price_from}} грн'
    fields:
      - { name: title, label: Назва, widget: string, required: true }

      - name: price_from
        label: Ціна від, грн
        widget: number
        required: true
        value_type: int
        min: 1
        i18n: duplicate
        hint: Тільки число. Слово «від» і «грн» додаються автоматично

      - name: duration_min
        label: Тривалість, хв
        widget: number
        required: false
        value_type: int
        i18n: duplicate

      - name: note
        label: Примітка
        widget: string
        required: false
        pattern: ['^.{0,90}$', 'Не більше 90 символів']

      - name: order
        label: Порядок
        widget: number
        value_type: int
        default: 10
        i18n: duplicate

  # ─────────────────────────────────────────────
  # 4. ГАЛЕРЕЯ ДО/ПІСЛЯ
  # ─────────────────────────────────────────────
  - name: gallery
    label: Галерея до/після
    folder: src/content/gallery
    create: true
    delete: true
    i18n: true
    summary: '{{damage_type}} {{size_mm}} мм{{#if published}} ✓{{/if}}'
    fields:
      - name: before
        label: Фото ДО
        widget: image
        required: false
        i18n: duplicate
        hint: Мінімум 1200 px по короткій стороні. Оригінал з камери, не з месенджера

      - name: after
        label: Фото ПІСЛЯ
        widget: image
        required: false
        i18n: duplicate
        hint: Той самий ракурс і відстань, що й на фото ДО

      - name: damage_type
        label: Тип пошкодження
        widget: select
        required: true
        options:
          - { label: Зірка, value: star }
          - { label: Бичаче око, value: bullseye }
          - { label: Комбінований, value: combo }
          - { label: Тріщина, value: crack }

      - name: size_mm
        label: Розмір, мм
        widget: number
        required: true
        value_type: int
        min: 1
        max: 50
        i18n: duplicate

      - name: duration_min
        label: Час роботи, хв
        widget: number
        required: false
        value_type: int
        i18n: duplicate

      - name: published
        label: Опублікувати
        widget: boolean
        default: false
        i18n: duplicate
        hint: Вмикати тільки коли завантажені обидва фото

  # ─────────────────────────────────────────────
  # 5. ВІДГУКИ — безпечний рівень
  # ─────────────────────────────────────────────
  - name: reviews
    label: Відгуки
    folder: src/content/reviews
    create: true
    delete: true
    i18n: true
    summary: '{{author}} — {{rating}}★'
    fields:
      - { name: author, label: Ім'я, widget: string, required: true }

      - name: text
        label: Текст
        widget: text
        required: true
        pattern: ['^[\s\S]{1,400}$', 'Не більше 400 символів']

      - name: rating
        label: Оцінка
        widget: number
        value_type: int
        min: 1
        max: 5
        default: 5
        i18n: duplicate

      - { name: date, label: Дата, widget: datetime, i18n: duplicate }

      - name: source
        label: Джерело
        widget: select
        options: [Google, Viber, Особисто]
        i18n: duplicate

  # ─────────────────────────────────────────────
  # 6. ПИТАННЯ І ВІДПОВІДІ
  # ─────────────────────────────────────────────
  - name: faq
    label: Питання і відповіді
    folder: src/content/faq
    create: true
    delete: true
    i18n: true
    summary: '{{question}}'
    fields:
      - { name: question, label: Питання, widget: string, required: true }
      - { name: answer, label: Відповідь, widget: text, required: true }
      - name: in_schema
        label: Показувати в Google
        widget: boolean
        default: true
        i18n: duplicate
        hint: Питання потрапить у розмітку FAQ для пошуку
      - { name: order, label: Порядок, widget: number, value_type: int, default: 10, i18n: duplicate }

  # ─────────────────────────────────────────────
  # 7. SEO ТА ТЕКСТИ СТОРІНОК
  # ─────────────────────────────────────────────
  - name: pages
    label: Сторінки
    i18n: true
    files:
      - name: home
        label: Головна
        file: src/content/pages/home.yml
        i18n: true
        fields:
          - name: seo_title
            label: Заголовок для пошуку
            widget: string
            required: true
            pattern: ['^.{1,60}$', 'Не більше 60 символів — далі Google обрізає']

          - name: seo_description
            label: Опис для пошуку
            widget: text
            required: true
            pattern: ['^[\s\S]{1,155}$', 'Не більше 155 символів']

          - { name: h1, label: Головний заголовок, widget: string, required: true }
          - { name: hero_subtitle, label: Підзаголовок, widget: text, required: true }
          - { name: guarantee, label: Гарантія, widget: text, required: false }

      - name: mobile
        label: Виїзний ремонт
        file: src/content/pages/mobile.yml
        i18n: true
        fields:
          - name: seo_title
            label: Заголовок для пошуку
            widget: string
            required: true
            pattern: ['^.{1,60}$', 'Не більше 60 символів']

          - name: seo_description
            label: Опис для пошуку
            widget: text
            required: true
            pattern: ['^[\s\S]{1,155}$', 'Не більше 155 символів']

          - { name: h1, label: Головний заголовок, widget: string, required: true }
          - { name: hero_subtitle, label: Підзаголовок, widget: text, required: true }
