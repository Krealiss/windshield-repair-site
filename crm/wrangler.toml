# Конфіг для розгортання CRM. Локальний запуск бере wrangler.local.toml
# (поза git) — див. README.
name = "avtoskloua-crm"
main = "src/index.ts"
compatibility_date = "2026-09-26"

# База спільна з сайтом. Створена 12 жовтня 2026 в акаунті Cloudflare
# astorthak@gmail.com, регіон EEUR. Не секрет: це адреса ресурсу, а не
# ключ до нього — доступ дає привʼязка в конфізі воркера.
[[d1_databases]]
binding = "DB"
database_name = "leads"
database_id = "f544b21f-0869-482f-8277-4cf37ee4cd0d"

# Журнал Worker. Без цього console.error видно лише під `wrangler tail`,
# тобто лише якщо здогадатися дивитися. А дивитися знадобиться: коли
# токен бота перевипустять, картки в групі перестануть оновлюватися, і
# єдиний слід цього — рядок із drawCard (shared/notify.ts).
[observability]
enabled = true
