# ДЕМОНСТРАЦІЙНИЙ відгук — вигаданий. Не публікувати.
author: Сергій М.
text: >-
  Обдзвонив три місця, і всюди казали, що тільки заміна скла. Тут
  попросили надіслати фото і відразу сказали, що такий скол
  ремонтується. Скло родне, зекономив купу грошей.
