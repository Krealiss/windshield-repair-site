name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Крок 1: типи у functions/**. Першим навмисно: перевірка контенту
      # падає на заглушках, і все, що стоїть після неї, доти не запускається
      - name: Перевірка типів функцій
        run: npm run check:functions

      # Крок 2: контент. Падає раніше за збірку — помилка зрозуміліша
      - name: Перевірка контенту
        run: node scripts/validate-content.mjs --prod

      - name: Збірка
        run: npx astro build

      # Крок 3: продуктивність. Бюджет — вимога, не побажання
      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
